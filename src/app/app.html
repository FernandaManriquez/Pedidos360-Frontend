<main style="display:flex; flex-direction:column; align-items:center; padding:2rem; gap:1rem;">
  <h1>Pedidos360</h1>

  <button *ngIf="!isLoggedIn()" (click)="login()">Iniciar sesión</button>
  <button *ngIf="isLoggedIn()" (click)="logout()">Cerrar sesión</button>

  <nav *ngIf="isLoggedIn()" style="display:flex; gap:1rem;">
    <a routerLink="/productos">Productos</a>
    <a routerLink="/pedidos">Pedidos</a>
  </nav>

  <p *ngIf="isLoggedIn()">Sesión iniciada ✅</p>
</main>

<router-outlet />
